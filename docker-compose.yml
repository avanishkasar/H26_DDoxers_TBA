services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Default to an Ollama running on the host; `--profile ollama` overrides via OLLAMA_BASE_URL.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  # Optional containerised Ollama: `docker compose --profile ollama up`
  # and set OLLAMA_BASE_URL_DOCKER=http://ollama:11434 in .env.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  ollama:
